# Every pull request into main (and every push to main): the fast suite and the validation suite on Linux.
# main's branch protection requires both jobs ("fast tests", "validation") to pass before a PR can merge.
# The release workflow (release.yml) still does the full Linux + Windows run and the builds on a tag.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  brainpack:
    # data/ isn't in git: the pack is built from the public MaleCNS v1.0 connectome (~1.1 GB download) and cached,
    # with the same key as release.yml, so a PR almost always reuses it
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: data/kick_brain.npz
          key: brainpack-v2-${{ hashFiles('kickthefly/sim/connectome/loader.py', 'kickthefly/sim/brainpack.py') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build the brain pack
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install numpy scipy pyarrow
          python -m kickthefly.sim.connectome.loader build
          python -m kickthefly.sim.brainpack build
          rm -f data/*.feather data/graph.pkl
      - uses: actions/upload-artifact@v4
        with:
          name: brainpack
          path: data/kick_brain.npz
          retention-days: 1

  fast:
    name: fast tests
    needs: brainpack
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: brainpack, path: data}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt pytest numba
      - name: Fast suite (numba installed, so its bit-exactness with NumPy is checked too)
        run: python -m pytest -m "not validation" -v -rs

  validation:
    name: validation
    needs: brainpack
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: brainpack, path: data}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Validation suite (fails if any PASS/FAIL result changes, in either direction)
        env:
          KTF_VALIDATION_WORKERS: "4"
          KTF_VALIDATION_OUT: data/validation_results.json
        run: python -m pytest -m validation -v -rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: data/validation_results.json
          retention-days: 14
