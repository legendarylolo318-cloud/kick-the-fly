# Tag push (v*): run ci.yml (checks, tests on Linux and Windows, the AppImage and the .exe), then publish a release with both files and
# SHA256SUMS. Nothing is published unless every job of ci.yml passed.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: KickTheFly-x86_64.AppImage, path: dist}
      - uses: actions/download-artifact@v4
        with: {name: KickTheFly.exe, path: dist}
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum KickTheFly-x86_64.AppImage KickTheFly.exe > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/KickTheFly-x86_64.AppImage dist/KickTheFly.exe dist/SHA256SUMS --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
