[workspace]
resolver = "3"
members = ["crates/fly_sim", "crates/ktf_data", "crates/ktf_ui", "crates/game"]

[workspace.package]
version = "4.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/legendarylolo318-cloud/kick-the-fly"

# Every dependency is pinned to an exact version with `=`, here once, for the whole workspace. Bevy and anything built on Bevy
# must be bumped together: change the pins in this table only.
[workspace.dependencies]
# Bevy 0.19.1 is the latest stable (0.20 is still a release candidate). The game picks its feature set; dynamic linking is a dev-only feature.
bevy = { version = "=0.19.1", default-features = false }
# Physics: avian3d 0.7 is built for Bevy 0.19 (bevy_rapier3d 0.36 is too; avian is ECS-native and has the joints and spatial queries we use).
avian3d = { version = "=0.7.0", default-features = false, features = ["3d", "f32", "parry-f32", "default-collider", "xpbd_joints", "parallel"] }
# Microphone input for Johnston's organ. `pulseaudio` is the native PulseAudio protocol (also served by PipeWire); ALSA is the fallback.
cpal = { version = "=0.18.2" }
bytemuck = "=1.25.2"
rayon = "=1.12.0"
# Linux only: the sim threads lower their own priority (setpriority on their thread id)
libc = "=0.2.190"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
sha2 = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
serde_yaml_ng = "=0.10.0"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
directories = "=6.0.0"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
ktf_data = { path = "crates/ktf_data" }
ktf_ui = { path = "crates/ktf_ui" }
ab_glyph = "=0.2.32"
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
png = "=0.18.1"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support", "rayon"] }
fly_sim = { path = "crates/fly_sim" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# `cargo build --profile fast-release`: for testing changes. Thin LTO and 16 codegen units use every core, so it links in a fraction of the time;
# the binary is a little slower than `release`, which stays the shipping profile (and the one to measure for numbers).
[profile.fast-release]
inherits = "release"
lto = "thin"
codegen-units = 16

# Dev builds: our own crates at opt-level 1, dependencies (Bevy, rayon) at 3, so the game and the sim are usable without --release.
[profile.dev]
opt-level = 1

[profile.dev.package.ktf_ui]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
lto = "fat"
codegen-units = 1
opt-level = 3
