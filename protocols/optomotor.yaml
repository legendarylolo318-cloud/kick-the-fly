# Optomotor response assay: wide-field directional motion stimulation
# driving progressive (T4a/T5a) and regressive (T4b/T5b) visual neurons,
# recording descending steering neurons DNa01 and DNa02 (Borst et al. 2020).
name: optomotor
seed: 1000
flies: 5
warmup_s: 2
duration_s: 4
stimuli:
  - {at_s: 2.0, for_s: 2.0, target: optomotor_right, mode: drive, amp: 0.5}
recordings:
  - {name: dna_steer_r, neurons: dna_steer_r}
  - {name: optomotor_detectors, neurons: optomotor_right}
  - {name: descending, neurons: "superclass:descending_neuron"}
