# CO2 avoidance assay: specialized olfactory receptor neurons (ORN_V)
# exciting V glomerulus projection neurons (V_ilPN, V_l2PN; Suh et al. 2004).
name: co2_avoidance
seed: 1000
flies: 5
warmup_s: 2
duration_s: 4
stimuli:
  - {at_s: 2.0, for_s: 2.0, target: co2_orn, mode: drive, amp: 0.5}
recordings:
  - {name: co2_pn, neurons: co2_pn}
  - {name: co2_orn, neurons: co2_orn}
  - {name: sensory_all, neurons: "superclass:cb_sensory"}
