# Fly individuality consistency: repeated trials across different seeds testing trait consistency
# Kain et al. 2012; Linneweber et al. 2020.
name: individuality_consistency
individuality: subtle
seed: 1000
flies: 5
warmup_s: 2
duration_s: 4
stimuli:
  - {at_s: 1.0, for_s: 1.0, target: loom, mode: drive, amp: 0.5}
  - {at_s: 2.5, for_s: 1.0, target: sweet, mode: drive, amp: 0.5}
recordings:
  - {name: giant_fiber, neurons: dnp01}
  - {name: mn9_proboscis, neurons: mn9}
