# Thermotaxis assay: warm (TRN_VP2) and cold (TRN_VP3) antennal thermosensory neurons
# driving second-order VP2 and VP3 projection neurons (Gallio et al. 2011).
name: thermotaxis
seed: 1000
flies: 5
warmup_s: 2
duration_s: 5
stimuli:
  - {at_s: 1.5, for_s: 1.5, target: trn_vp2, mode: drive, amp: 0.5}
  - {at_s: 3.5, for_s: 1.5, target: trn_vp3, mode: drive, amp: 0.5}
recordings:
  - {name: vp2_pn_warm, neurons: vp2_pn}
  - {name: vp3_pn_cold, neurons: vp3_pn}
  - {name: hot_sensors, neurons: trn_vp2}
  - {name: cold_sensors, neurons: trn_vp3}
