# Grooming hierarchy assay: anterior grooming command neurons (aDN1/aDN2)
# activation and readout from front-leg (mn_front) vs hind-leg (mn_hind) motor neurons (Seeds et al. 2014).
name: grooming_hierarchy
seed: 1000
flies: 5
warmup_s: 2
duration_s: 4
stimuli:
  - {at_s: 2.0, for_s: 2.0, target: adn, mode: drive, amp: 0.5}
recordings:
  - {name: adn_command, neurons: adn}
  - {name: mn_front, neurons: mn_front}
  - {name: mn_hind, neurons: mn_hind}
