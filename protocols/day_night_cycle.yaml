# Day/night circadian cycle assay: photic drive to circadian clock neurons
# and dorsal fan-shaped body (dFB) sleep circuit monitoring.
name: day_night_cycle
seed: 1000
flies: 5
warmup_s: 2
duration_s: 4
stimuli:
  - {at_s: 2.0, for_s: 2.0, target: light, mode: drive, amp: 0.5}
recordings:
  - {name: clock_l_lnv, neurons: "type:l-LNv"}
  - {name: clock_s_lnv, neurons: "type:s-LNv"}
  - {name: dfb_sleep_fb6, neurons: "prefix:FB6"}
  - {name: dfb_sleep_fb7, neurons: "prefix:FB7"}
