# Bitter avoidance assay: bitter-pathway gustatory receptor neurons
# driving DNg28 (Bitter-SEL projection neurons; Yao & Scott 2022).
name: bitter_avoidance
seed: 1000
flies: 5
warmup_s: 2
duration_s: 4
stimuli:
  - {at_s: 2.0, for_s: 2.0, target: bitter, mode: drive, amp: 0.5}
recordings:
  - {name: bitter_sel_pn, neurons: dng28}
  - {name: bitter_grn, neurons: bitter}
  - {name: sugar_grn, neurons: sweet}
